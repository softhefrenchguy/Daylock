name: daylock
description: "A local-first daily planning and commitments app."
publish_to: 'none'
version: 0.1.0+15

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_appauth: ^12.1.0
  flutter_local_notifications: 22.3.2
  flutter_secure_storage: ^11.2.0
  google_sign_in: ^7.2.0
  google_sign_in_platform_interface: ^3.1.0
  http: ^1.6.0
  shared_preferences: ^2.5.6
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: 0.14.4
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true
